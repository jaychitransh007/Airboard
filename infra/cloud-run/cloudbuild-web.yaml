steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=infra/cloud-run/web.Dockerfile
      - --tag=${_IMAGE}
      - --build-arg=NEXT_PUBLIC_AIRBOARD_API_URL=${_AIRBOARD_API_URL}
      - --build-arg=NEXT_PUBLIC_GOOGLE_MEET_CLOUD_PROJECT_NUMBER=${_GOOGLE_MEET_CLOUD_PROJECT_NUMBER}
      - .
images:
  - ${_IMAGE}
options:
  logging: CLOUD_LOGGING_ONLY
