name: Live evaluation suites

on:
  pull_request:
    paths:
      - "apps/api/src/semanticIntent/**"
      - "apps/api/src/transcription/**"
      - "apps/web/src/features/board/browserSpeech.ts"
      - "apps/web/src/features/board/gesturePerceptionConfig.ts"
      - "apps/web/src/features/board/intentCanvasParser.ts"
      - "apps/web/src/features/board/semanticIntent.ts"
      - "packages/core/src/semanticCapabilities.ts"
      - "packages/core/src/semanticPlan.ts"
      - "packages/gesture-engine/src/**"
      - "evals/audio/**"
      - "evals/voice-intent/**"
      - "scripts/eval-audio-stt.mjs"
      - "scripts/eval-voice-intent.mjs"
  schedule:
    # 20:17 UTC / 01:47 IST: avoid the busiest top-of-hour runner window.
    - cron: "17 20 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: Live evaluation tier to run
        required: true
        default: canary
        type: choice
        options:
          - canary
          - nightly
          - release
      confirm_live_provider:
        description: I authorize this run to send the privacy-safe eval corpus to the live provider
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Serialize all provider-spend tiers so canary/release dispatches cannot race
  # the scheduled nightly against shared quota or mutable provider behavior.
  group: live-provider-evals
  cancel-in-progress: false

jobs:
  evaluate:
    name: ${{ github.event_name == 'schedule' && 'nightly' || github.event_name == 'pull_request' && 'canary' || inputs.tier }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      - self-hosted
      - eval-media
    timeout-minutes: 360
    # The protected environment owns provider credentials, model allowlists,
    # pricing metadata, and the path to the encrypted read-only media mount.
    environment: live-provider-evals
    env:
      EVAL_TIER: ${{ github.event_name == 'schedule' && 'nightly' || github.event_name == 'pull_request' && 'canary' || inputs.tier }}
      AIRBOARD_EVAL_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
      AIRBOARD_EVAL_MEDIA_ROOT: ${{ vars.AIRBOARD_EVAL_MEDIA_ROOT }}
      AIRBOARD_EVAL_BASELINE_MODEL: ${{ vars.AIRBOARD_EVAL_BASELINE_MODEL }}
      AIRBOARD_EVAL_CANDIDATE_MODEL: ${{ vars.AIRBOARD_EVAL_CANDIDATE_MODEL }}
      AIRBOARD_EVAL_MODEL: ${{ vars.AIRBOARD_EVAL_CANDIDATE_MODEL }}
      AIRBOARD_EVAL_INPUT_USD_PER_MILLION: ${{ vars.AIRBOARD_EVAL_INPUT_USD_PER_MILLION }}
      AIRBOARD_EVAL_OUTPUT_USD_PER_MILLION: ${{ vars.AIRBOARD_EVAL_OUTPUT_USD_PER_MILLION }}

    steps:
      - name: Confirm manual provider spend
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.confirm_live_provider }}
        run: |
          echo "::error::Re-run with confirm_live_provider enabled."
          exit 1

      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        timeout-minutes: 15
        run: pnpm install --frozen-lockfile

      - name: Build packages and applications
        timeout-minutes: 20
        run: pnpm -r build

      - name: Install browser for nightly and release replay
        if: ${{ env.EVAL_TIER != 'canary' }}
        timeout-minutes: 15
        run: pnpm --filter @airboard/web exec playwright install chromium

      - name: Run live evaluation
        timeout-minutes: 330
        env:
          # Provider keys are scoped to this step. The API inherits them and
          # clients use only the localhost endpoints.
          AIRBOARD_INTENT_API_KEY: ${{ secrets.AIRBOARD_EVAL_OPENAI_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.AIRBOARD_EVAL_DEEPGRAM_API_KEY }}
          AIRBOARD_API_TOKEN: ${{ secrets.AIRBOARD_EVAL_API_TOKEN }}
          AIRBOARD_EVAL_API_TOKEN: ${{ secrets.AIRBOARD_EVAL_API_TOKEN }}
          AIRBOARD_INTENT_MODEL: ${{ vars.AIRBOARD_EVAL_BASELINE_MODEL }}
          AIRBOARD_INTENT_ALLOWED_MODELS: ${{ vars.AIRBOARD_EVAL_INTENT_ALLOWED_MODELS }}
          AIRBOARD_API_URL: http://127.0.0.1:4000
          AIRBOARD_EVAL_ORIGIN: http://localhost:3000
          AIRBOARD_ALLOWED_ORIGINS: http://localhost:3000
          AIRBOARD_RATE_LIMIT_INTENT_PER_MINUTE: "10000"
          AIRBOARD_INTENT_TIMEOUT_MS: "15000"
          HOST: 127.0.0.1
          PORT: "4000"
        run: |
          set -euo pipefail
          if [[ -z "${AIRBOARD_INTENT_API_KEY}" ]]; then
            echo "::error::Configure AIRBOARD_EVAL_OPENAI_API_KEY in the live-provider-evals environment."
            exit 1
          fi
          if [[ -z "${AIRBOARD_INTENT_ALLOWED_MODELS}" ]]; then
            echo "::error::Configure AIRBOARD_EVAL_INTENT_ALLOWED_MODELS for the protected API."
            exit 1
          fi
          if [[ -z "${DEEPGRAM_API_KEY}" ]]; then
            echo "::error::Configure AIRBOARD_EVAL_DEEPGRAM_API_KEY for live audio evaluation."
            exit 1
          fi
          if [[ -z "${AIRBOARD_EVAL_MEDIA_ROOT}" || ! -d "${AIRBOARD_EVAL_MEDIA_ROOT}" ]]; then
            echo "::error::Configure AIRBOARD_EVAL_MEDIA_ROOT as the encrypted read-only corpus mount."
            exit 1
          fi
          if [[ "${EVAL_TIER}" != "canary" ]]; then
            if [[ -z "${AIRBOARD_EVAL_INPUT_USD_PER_MILLION}" || -z "${AIRBOARD_EVAL_OUTPUT_USD_PER_MILLION}" ]]; then
              echo "::error::Configure protected input/output pricing variables for cost regression."
              exit 1
            fi
          fi
          if [[ "${EVAL_TIER}" == "nightly" ]]; then
            if [[ -z "${AIRBOARD_EVAL_BASELINE_MODEL}" || -z "${AIRBOARD_EVAL_CANDIDATE_MODEL}" ]]; then
              echo "::error::Nightly comparison requires baseline and candidate model variables."
              exit 1
            fi
            if [[ "${AIRBOARD_EVAL_BASELINE_MODEL}" == "${AIRBOARD_EVAL_CANDIDATE_MODEL}" ]]; then
              echo "::error::Nightly baseline and candidate models must be different."
              exit 1
            fi
          fi
          if [[ "${EVAL_TIER}" == "release" && -z "${AIRBOARD_EVAL_CANDIDATE_MODEL}" ]]; then
            echo "::error::Release evaluation requires an explicit candidate model."
            exit 1
          fi

          eval_directory="artifacts/evals/${AIRBOARD_EVAL_RUN_ID}"
          mkdir -p "${eval_directory}"
          api_log="${RUNNER_TEMP}/airboard-eval-api-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          node apps/api/dist/index.mjs >"${api_log}" 2>&1 &
          api_pid=$!
          # The API inherited provider keys; do not expose them to eval/browser
          # children, which use only localhost and the scoped API token.
          unset AIRBOARD_INTENT_API_KEY
          unset DEEPGRAM_API_KEY
          unset AIRBOARD_API_TOKEN
          cleanup() {
            kill "${api_pid}" 2>/dev/null || true
            wait "${api_pid}" 2>/dev/null || true
            rm -f -- "${api_log}"
          }
          trap cleanup EXIT

          api_ready=0
          for attempt in {1..30}; do
            if curl --silent --show-error --fail \
              "http://127.0.0.1:4000/health" >/dev/null; then
              api_ready=1
              break
            fi
            if ! kill -0 "${api_pid}" 2>/dev/null; then
              echo "::error::The evaluation API exited during startup."
              tail -n 80 "${api_log}"
              exit 1
            fi
            sleep 2
          done
          if [[ "${api_ready}" != "1" ]]; then
            echo "::error::The evaluation API did not become healthy within 60 seconds."
            tail -n 80 "${api_log}"
            exit 1
          fi

          pnpm "eval:${EVAL_TIER}"

      # Upload only structured/text reports. API logs, Playwright traces,
      # screenshots, audio, video, and externally mounted media are excluded.
      - name: Upload privacy-safe evaluation reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ env.EVAL_TIER }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/evals/**/*.json
            artifacts/evals/**/*.xml
            artifacts/evals/**/*.md
            artifacts/evals/**/*.html
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: false

      - name: Remove generated evaluation data from the media runner
        if: ${{ always() }}
        run: |
          node -e "const fs = require('node:fs'); for (const path of ['artifacts/evals', 'test-results', 'playwright-report', 'apps/web/test-results', 'apps/web/playwright-report']) fs.rmSync(path, { recursive: true, force: true })"
