name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck, tests, safety evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # gesture-engine tests run against its built dist output.
      - name: Build packages
        run: pnpm -r build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Merge gate: ambient meeting talk must never parse as a board mutation.
      - name: Voice false-accept eval
        run: pnpm eval:false-accepts
