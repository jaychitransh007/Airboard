name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck, tests, safety evals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs before the build, because the web build regenerates the help
      # content: a stale committed helpContent.ts must fail here.
      - name: Help documentation
        run: pnpm docs:check

      # Builds the API and web apps. Package tests import source, so they
      # don't depend on this step.
      - name: Build apps
        run: pnpm -r build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # Repository scripts (launch check, eval tooling) have their own tests.
      - name: Script tests
        run: pnpm test:scripts

      # Only shipped dependencies; dev tooling is tracked separately.
      - name: Dependency audit (production)
        run: pnpm audit --prod --audit-level=high

      # Eval CLIs only; a failing step prints its whole output here.
      - name: Offline interaction evaluation gate
        run: pnpm eval:pr

  e2e:
    name: Playwright E2E (interaction layer)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No build step: Playwright's webServer builds the API itself and runs
      # next dev, and the workspace packages are consumed as source.
      - name: Install Playwright browsers
        run: pnpm --filter @airboard/web exec playwright install chromium --with-deps

      - name: Run E2E tests
        run: pnpm --filter @airboard/web e2e

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The repository is public, so every commit is scanned. Reviewed false
      # positives are listed by fingerprint in .gitleaksignore.
      - name: Scan history with gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0
          git /repo --redact --no-banner --gitleaks-ignore-path=/repo/.gitleaksignore
