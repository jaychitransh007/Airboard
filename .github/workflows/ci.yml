name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck, tests, safety evals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # gesture-engine tests run against its built dist output.
      - name: Build packages
        run: pnpm -r build

      - name: Package and validate Chrome extension
        run: pnpm build:extension

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Help documentation
        run: pnpm docs:check

      - name: Offline interaction evaluation gate
        run: pnpm eval:pr --skip-browser

      - name: Upload privacy-safe evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-pr-${{ github.run_id }}
          path: artifacts/evals/
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: Playwright E2E (interaction layer)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r build

      - name: Install Playwright browsers
        run: pnpm --filter @airboard/web exec playwright install chromium --with-deps

      - name: Run E2E tests
        run: pnpm --filter @airboard/web e2e
