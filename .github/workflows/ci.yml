name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck, tests, safety evals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds the API and web apps (their build-time checks run here).
      # Package tests import source, so they don't depend on this step.
      - name: Build apps
        run: pnpm -r build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # Repository scripts (launch check, eval tooling) have their own tests.
      - name: Script tests
        run: pnpm test:scripts

      # Only shipped dependencies; dev tooling is tracked separately.
      - name: Dependency audit (production)
        run: pnpm audit --prod --audit-level=high

      - name: Help documentation
        run: pnpm docs:check

      - name: Offline interaction evaluation gate
        run: pnpm eval:pr --skip-browser

      - name: Upload privacy-safe evaluation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-pr-${{ github.run_id }}
          path: artifacts/evals/
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: Playwright E2E (interaction layer)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r build

      - name: Install Playwright browsers
        run: pnpm --filter @airboard/web exec playwright install chromium --with-deps

      - name: Run E2E tests
        run: pnpm --filter @airboard/web e2e

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The repository is public, so every commit is scanned. Reviewed false
      # positives are listed by fingerprint in .gitleaksignore.
      - name: Scan history with gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0
          git /repo --redact --no-banner --gitleaks-ignore-path=/repo/.gitleaksignore
