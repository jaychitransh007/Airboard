name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck, tests, safety evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # gesture-engine tests run against its built dist output.
      - name: Build packages
        run: pnpm -r build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Merge gates for the voice grammar, in both directions:
      # nothing users say may break, and no meeting talk may start executing.
      - name: Voice grammar eval (positives)
        run: pnpm eval:grammar

      - name: Voice false-accept eval (negatives)
        run: pnpm eval:false-accepts

  e2e:
    name: Playwright E2E (interaction layer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r build

      - name: Install Playwright browsers
        run: pnpm --filter @airboard/web exec playwright install chromium --with-deps

      - name: Run E2E tests
        run: pnpm --filter @airboard/web e2e
