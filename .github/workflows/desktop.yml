name: Desktop app

# Builds the desktop overlay for macOS and Windows. A run started by hand
# keeps the installers as workflow artifacts; pushing a `desktop-v<version>`
# tag also puts them on a draft GitHub release, which automatic updates read
# once it is published. Signing runs only when its secrets exist; see
# apps/desktop/README.md.

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm --filter @airboard/desktop test

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$GITHUB_REF_NAME" != "desktop-v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match apps/desktop/package.json version $version"
            exit 1
          fi

      # Signing secrets go only to the platform that uses them.
      - name: Package for macOS
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm run package:mac

      - name: Package for Windows
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          AZURE_TRUSTED_SIGNING_PUBLISHER: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: pnpm run package:win

      - name: Keep the installers
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest*.yml
          if-no-files-found: error
          retention-days: 14

  # One job uploads everything, so the two platforms never race to create
  # the release.
  draft-release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: installers
          merge-multiple: true

      - name: Upload to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "Airboard desktop ${GITHUB_REF_NAME#desktop-v}" \
              --notes "Desktop overlay ${GITHUB_REF_NAME#desktop-v}. Publish this draft and mark it as the latest release to send it to installed apps."
          fi
          gh release upload "$GITHUB_REF_NAME" installers/* --clobber
