version: 2
updates:
  # Weekly dependency updates, with minor and patch releases grouped into one
  # pull request so they are easy to review against CI.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node's types follow the Node 22 runtime in the Docker images; move them
      # together with the runtime, not on their own.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
