version: 2
updates:
  # Weekly dependency updates, with minor and patch releases grouped into one
  # pull request so they are easy to review against CI.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
